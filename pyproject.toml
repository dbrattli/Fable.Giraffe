[project]
name = "giraffe"
version = "0.2.1"
description = "Fable Giraffe"
authors = [{ name = "Dag Brattli", email = "dag@brattli.net" }]
requires-python = ">=3.12,<4.0"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fable-library==5.11.0",
    "structlog>=26.1.0,<27",
    "starlette>=1.3.1,<2",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.0,<1.5",
    "uvicorn>=0.51.0,<0.52",
    "pyinstrument>=5.1.2,<6",
]

[tool.uv]
package = false
