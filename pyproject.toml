[project]
name = "giraffe"
version = "0.2.1"
description = "Fable Giraffe"
authors = [{ name = "Dag Brattli", email = "dag@brattli.net" }]
requires-python = ">=3.12,<4.0"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fable-library==5.5.0",
    "structlog>=24.4.0,<25",
    "starlette>=1.0.0,<2",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=1.4.0,<1.5",
    "uvicorn>=0.50.0,<0.51",
    "pyinstrument>=5.1.2,<6",
]

[tool.uv]
package = false
