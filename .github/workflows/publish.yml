name: Publish NuGet

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  shipit-pr:
    name: ShipIt - Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!startsWith(github.event.head_commit.message, 'chore: release ')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install tools
        run: dotnet tool restore

      - name: ShipIt (Pull Request)
        run: just shipit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "startsWith(github.event.head_commit.message, 'chore: release ')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Extract version
        id: version
        run: |
          MESSAGE="${{ github.event.head_commit.message }}"
          VERSION="${MESSAGE#chore: release }"
          VERSION="${VERSION%% *}"
          # ShipIt titles the PR "chore: release <name>@<version>"; strip the name@ prefix.
          VERSION="${VERSION##*@}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: |
          dotnet tool restore
          dotnet restore src

      - name: Pack NuGet
        run: just pack-version ${{ steps.version.outputs.version }}

      - name: Push NuGet
        run: dotnet nuget push 'src/**/Release/*.nupkg' -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }}

      - name: Create GitHub Release
        run: gh release create ${{ steps.version.outputs.tag }} --title "${{ steps.version.outputs.version }}" --generate-notes || echo "Release already exists"
        env:
          GH_TOKEN: ${{ github.token }}
