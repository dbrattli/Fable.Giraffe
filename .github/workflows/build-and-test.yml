name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Erlang/rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3'

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup
        run: just setup

      - name: Build
        run: just build

      - name: Test
        run: just test
